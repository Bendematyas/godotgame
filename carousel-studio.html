<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carousel Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Design tokens ─────────────────────────── */
:root{
  --c-bg:#F0F2F5;--c-surface:#FFFFFF;--c-border:#E2E6EA;--c-border2:rgba(0,0,0,.06);
  --c-text:#1C1E21;--c-mid:#4A5060;--c-soft:#9298A4;
  --c-green:#5B8A62;--c-green2:#7AAF82;--c-greenBg:#EAF1EB;
  --c-red:#E05050;--c-redBg:#FDEAEA;
  --c-topbar:#1C1E21;
  --sh:0 1px 3px rgba(0,0,0,.06),0 1px 8px rgba(0,0,0,.04);
  --sh-md:0 4px 12px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --sh-lg:0 12px 40px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06);
  --r:10px;--r-sm:6px;--r-lg:14px;
  /* carousel palette passthrough (updated by applyCSSVars) */
  --bg:#F4EFE4;--surface:#EDE6D6;--primary:#6A9170;--primaryMid:#97B89B;
  --primarySoft:#C4D8C6;--accent:#C8A87C;--accentSoft:#E2D2B4;
  --text:#2C2820;--textMid:#58504A;--textSoft:#8A7D72;--white:#FDFAF3;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Nunito','Helvetica Neue',Arial,sans-serif;background:var(--c-bg);color:var(--c-text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ── App shell ─────────────────────────────── */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── Topbar ────────────────────────────────── */
#topbar{height:52px;background:var(--c-topbar);display:flex;align-items:center;padding:0 16px;gap:14px;flex-shrink:0;z-index:20}
.brand{display:flex;align-items:center;gap:8px;flex-shrink:0;text-decoration:none}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--c-green);box-shadow:0 0 10px rgba(91,138,98,.7);flex-shrink:0}
.brand-name{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.3px}
.topbar-palette{flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.topbar-palette::-webkit-scrollbar{display:none}
.pal-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;flex-shrink:0;border:2.5px solid transparent;transition:.15s;position:relative}
.pal-dot:hover{transform:scale(1.15)}
.pal-dot.active{border-color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.4)}
.pal-dot[title]:hover::after{content:attr(title);position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;white-space:nowrap;pointer-events:none;z-index:99}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ratio-group{display:flex;background:rgba(255,255,255,.1);border-radius:8px;padding:2px;gap:2px}
.ratio-btn{background:none;border:none;color:rgba(255,255,255,.55);font-family:inherit;font-size:12px;font-weight:700;padding:4px 11px;border-radius:6px;cursor:pointer;transition:.15s}
.ratio-btn.active{background:var(--c-green);color:#fff}

/* ── Workspace (desktop 3-col) ─────────────── */
.workspace{flex:1;display:grid;grid-template-columns:210px 1fr 290px;overflow:hidden;min-height:0}
.ws-col{display:flex;flex-direction:column;overflow:hidden;min-height:0}
.col-slides{border-right:1px solid var(--c-border);background:var(--c-surface)}
.col-canvas{background:var(--c-bg)}
.col-props{border-left:1px solid var(--c-border);background:var(--c-surface);overflow-y:auto}

/* ── Panel headers ─────────────────────────── */
.col-hdr{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--c-border);flex-shrink:0}
.col-hdr-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--c-soft)}
.hdr-btn{width:28px;height:28px;border-radius:var(--r-sm);border:1.5px solid var(--c-border);background:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--c-mid);transition:.12s;font-weight:700}
.hdr-btn:hover{background:var(--c-greenBg);color:var(--c-green);border-color:var(--c-green2)}

/* ── Slide thumb list ──────────────────────── */
.slide-thumbs{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:5px}
.thumb-card{border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:.15s;background:var(--c-bg);position:relative;user-select:none}
.thumb-card:hover{border-color:var(--c-green2)}
.thumb-card.active{border-color:var(--c-green);box-shadow:0 0 0 3px rgba(91,138,98,.15)}
.thumb-card.drag-over{outline:2px solid var(--c-green);outline-offset:1px}
.thumb-card svg{display:block;width:100%;height:auto}
.thumb-lbl{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:10px;font-weight:700;padding:10px 6px 4px;display:flex;align-items:flex-end;justify-content:space-between}
.thumb-del-btn{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.45);border:none;color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:.12s;line-height:1}
.thumb-card:hover .thumb-del-btn{opacity:1}

/* Add-slide dropdown */
.add-menu{background:var(--c-surface);border-bottom:1px solid var(--c-border);flex-direction:column;padding:4px;gap:2px}
.add-menu.open{display:flex}
.add-menu button{background:none;border:none;font-family:inherit;font-size:12px;font-weight:600;color:var(--c-mid);padding:7px 10px;border-radius:var(--r-sm);cursor:pointer;text-align:left;transition:.1s}
.add-menu button:hover{background:var(--c-greenBg);color:var(--c-green)}

/* ── Canvas area ───────────────────────────── */
.canvas-inner{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;min-height:0;overflow:hidden}
#preview-wrap{display:flex;align-items:center;justify-content:center;max-width:100%;max-height:100%}
#preview-wrap svg{display:block;width:auto;height:auto;max-width:100%;max-height:calc(100vh - 52px - 96px);border-radius:4px;box-shadow:var(--sh-lg)}
.canvas-controls{flex-shrink:0;background:var(--c-surface);border-top:1px solid var(--c-border);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.nav-row{display:flex;align-items:center;justify-content:center;gap:10px}
.nav-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--c-border);background:var(--c-surface);cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:.15s;color:var(--c-mid);line-height:1}
.nav-btn:hover{background:var(--c-greenBg);border-color:var(--c-green);color:var(--c-green)}
.nav-btn:disabled{opacity:.3;pointer-events:none}
.slide-counter{font-size:13px;font-weight:700;color:var(--c-mid);min-width:48px;text-align:center}
.vrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctrl-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--c-soft);margin-right:2px}
.v-btn{padding:4px 10px;border-radius:20px;border:1.5px solid var(--c-border);background:none;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--c-mid);transition:.12s;min-height:28px}
.v-btn:hover{background:var(--c-greenBg);border-color:var(--c-green2)}
.v-btn.active{background:var(--c-green);color:#fff;border-color:var(--c-green)}
.toggle-wrap{display:flex;align-items:center;gap:6px;margin-left:auto}
.toggle{position:relative;width:36px;height:20px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;background:var(--c-border);border-radius:9999px;cursor:pointer;transition:.2s}
.toggle-slider::before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+.toggle-slider{background:var(--c-green)}
.toggle input:checked+.toggle-slider::before{transform:translateX(16px)}

/* ── Props panel ───────────────────────────── */
.props-inner{display:flex;flex-direction:column;gap:1px;padding:10px;gap:8px}
.prop-sec{border-radius:var(--r);border:1px solid var(--c-border);overflow:hidden}
.prop-sec-hdr{padding:9px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:12px;font-weight:700;color:var(--c-mid);user-select:none;background:var(--c-bg);transition:.1s}
.prop-sec-hdr:hover{background:var(--c-greenBg)}
.prop-sec-hdr.static{cursor:default}
.prop-sec-hdr.static:hover{background:var(--c-bg)}
.prop-sec-chevron{font-size:12px;color:var(--c-soft);transition:transform .2s;display:inline-block}
.prop-sec-chevron.open{transform:rotate(90deg)}
.prop-sec-body{padding:12px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--c-border)}
.prop-sec-body.collapsed{display:none}

/* ── Form elements ─────────────────────────── */
.field-group{display:flex;flex-direction:column;gap:4px}
.field-label{font-size:10px;font-weight:800;color:var(--c-soft);text-transform:uppercase;letter-spacing:.6px}
.field-input{border:1.5px solid var(--c-border);border-radius:var(--r-sm);padding:7px 10px;font-family:inherit;font-size:13px;background:var(--c-bg);color:var(--c-text);width:100%;transition:.15s}
.field-input:focus{outline:none;border-color:var(--c-green);background:#fff;box-shadow:0 0 0 3px rgba(91,138,98,.1)}
textarea.field-input{resize:vertical;min-height:60px}
.json-area{width:100%;min-height:100px;border:1.5px solid var(--c-border);border-radius:var(--r-sm);padding:8px;font-family:'SFMono-Regular',Consolas,monospace;font-size:11px;background:var(--c-bg);color:var(--c-text);resize:vertical}
.json-area:focus{outline:none;border-color:var(--c-green)}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}
.btn{padding:7px 13px;border-radius:var(--r-sm);border:1.5px solid var(--c-border);background:var(--c-bg);color:var(--c-text);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;min-height:32px;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--c-greenBg);border-color:var(--c-green2)}
.btn-primary{background:var(--c-green);color:#fff;border-color:var(--c-green)}
.btn-primary:hover{background:var(--c-green2);border-color:var(--c-green2)}
.btn-sm{padding:5px 10px;font-size:11px;min-height:28px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:20px;border:1.5px solid var(--c-border);background:none;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--c-mid);transition:.12s;min-height:28px;display:inline-flex;align-items:center}
.chip:hover{background:var(--c-greenBg);border-color:var(--c-green2)}
.chip.active{background:var(--c-green);color:#fff;border-color:var(--c-green)}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:3px;max-height:200px;overflow-y:auto}
.icon-cell{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:7px;cursor:pointer;border:1.5px solid transparent;transition:.12s;background:var(--c-bg)}
.icon-cell:hover{background:var(--c-greenBg)}
.icon-cell.active{background:var(--c-greenBg);border-color:var(--c-green)}
.icon-cell svg{width:17px;height:17px;stroke:var(--c-mid);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-cell.active svg{stroke:var(--c-green)}
.items-list{display:flex;flex-direction:column;gap:4px}
.item-row{display:flex;align-items:center;gap:4px}
.item-row input{flex:1}
.drag-handle{cursor:grab;color:var(--c-soft);font-size:14px;flex-shrink:0;padding:2px}
.drag-handle:active{cursor:grabbing}
.item-del{background:none;border:none;color:var(--c-soft);cursor:pointer;font-size:13px;padding:4px;border-radius:4px;transition:.1s}
.item-del:hover{color:var(--c-red);background:var(--c-redBg)}
.dl-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:4px 0}
.dl-lbl{font-size:12px;font-weight:600;color:var(--c-mid)}
.progress-bar-wrap{width:100%;background:var(--c-bg);border-radius:9999px;height:5px;overflow:hidden}
.progress-bar{height:100%;background:var(--c-green);border-radius:9999px;transition:width .3s;width:0%}

/* ── Type badges ───────────────────────────── */
.type-badge{border-radius:5px;padding:2px 7px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0}
.badge-cover{background:#C4D8C6;color:#2C4A30}
.badge-list{background:#D4C0E8;color:#3A2060}
.badge-quote{background:#F0D4C0;color:#5A2820}
.badge-content{background:#C0D8E8;color:#1A3850}
.badge-closing{background:#F0E8C0;color:#4A3A10}

/* ── Mobile workspace ──────────────────────── */
.mob-workspace{display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0}
.mob-tab{display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column;gap:10px}
.mob-tab.active{display:flex}
.mob-nav{height:54px;background:var(--c-surface);border-top:1px solid var(--c-border);display:none;flex-shrink:0}
.mob-nav-btn{flex:1;border:none;background:none;font-family:inherit;font-size:10px;font-weight:700;color:var(--c-soft);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.12s;padding-bottom:env(safe-area-inset-bottom,0)}
.mob-nav-btn.active{color:var(--c-green)}
.mob-nav-icon{font-size:18px;line-height:1}
.m-sec{background:var(--c-surface);border-radius:var(--r);border:1px solid var(--c-border);overflow:hidden}
.m-sec-hdr{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:13px;font-weight:700;color:var(--c-mid);user-select:none}
.m-sec-hdr:hover{background:var(--c-greenBg)}
.m-sec-body{padding:12px;border-top:1px solid var(--c-border);display:flex;flex-direction:column;gap:8px}
.m-sec-body.collapsed{display:none}
.m-slide-row{display:flex;align-items:center;gap:8px;padding:8px;background:var(--c-bg);border-radius:8px;cursor:pointer;border:1.5px solid transparent;transition:.12s;user-select:none}
.m-slide-row:hover{border-color:var(--c-border)}
.m-slide-row.active{border-color:var(--c-green);background:var(--c-greenBg)}
.m-slide-row.drag-over{border-color:var(--c-green2);background:var(--c-greenBg)}
.slide-preview-text{flex:1;font-size:12px;color:var(--c-mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-del-btn{background:none;border:none;color:var(--c-soft);cursor:pointer;font-size:14px;padding:4px;border-radius:4px;transition:.1s}
.m-del-btn:hover{color:var(--c-red)}
.add-slide-btns{display:flex;gap:4px;flex-wrap:wrap}
.add-slide-btns button{padding:4px 9px;border-radius:6px;border:1.5px dashed var(--c-border);background:none;font-family:inherit;font-size:11px;font-weight:700;color:var(--c-green);cursor:pointer;transition:.12s}
.add-slide-btns button:hover{background:var(--c-greenBg)}
.mini-preview-wrap{border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-md);background:var(--c-bg)}
.mini-preview-wrap svg{width:100%;height:auto;display:block}
.m-preview-wrap{border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-lg)}
.m-preview-wrap svg{width:100%;height:auto;display:block}
.m-nav-row{display:flex;align-items:center;justify-content:center;gap:10px;padding:4px 0}
.m-vrow{display:flex;gap:5px;flex-wrap:wrap}
.m-pal-row{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0}
.m-pal-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:.15s;flex-shrink:0}
.m-pal-dot.active{border-color:var(--c-green)}
.m-thumb-strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.m-thumb-strip::-webkit-scrollbar{display:none}
.m-thumb-item{flex-shrink:0;border-radius:7px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:.12s;width:64px}
.m-thumb-item svg{display:block;width:64px;height:auto}
.m-thumb-item.active{border-color:var(--c-green)}
.m-dl-group{background:var(--c-surface);border-radius:var(--r);padding:14px;border:1px solid var(--c-border);display:flex;flex-direction:column;gap:10px}
.m-dl-title{font-size:13px;font-weight:800;color:var(--c-text)}

/* ── Modal ─────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;display:flex;flex-direction:column;overflow:hidden}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;color:#fff;flex-shrink:0}
.modal-close{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:6px;line-height:1}
.modal-instr{background:#F5C542;color:#1a1a00;border-radius:10px;padding:10px 14px;margin:0 16px 12px;font-weight:800;font-size:14px;text-align:center}
.modal-body{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 16px 16px}
.modal-body img{max-width:100%;border-radius:10px;display:block}
.modal-scroll-hint{color:#aaa;font-size:13px;text-align:center}

/* ── Toast ─────────────────────────────────── */
#toast-root{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:9999;pointer-events:none}
.toast{background:#1C1E21;color:#fff;padding:9px 18px;border-radius:9999px;font-size:13px;font-weight:700;animation:toastIn .2s ease;box-shadow:0 4px 20px rgba(0,0,0,.25);white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── Scrollbars ────────────────────────────── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#D0D5DB;border-radius:3px}

/* ── Responsive ────────────────────────────── */
@media(max-width:960px){
  .workspace{display:none!important}
  .mob-workspace{display:flex}
  .mob-nav{display:flex}
}
@media(max-width:1200px) and (min-width:961px){
  .workspace{grid-template-columns:180px 1fr 260px}
}
</style>
</head>
<body>
<div id="app">

  <!-- ── TOPBAR ──────────────────────────── -->
  <div id="topbar">
    <div class="brand"><span class="brand-dot"></span><span class="brand-name">Carousel Studio</span></div>
    <div class="topbar-palette" id="topbar-palette"></div>
    <div class="topbar-right">
      <div class="ratio-group">
        <button class="ratio-btn active" id="rb-45" onclick="setRatio('4:5')">4:5</button>
        <button class="ratio-btn" id="rb-11" onclick="setRatio('1:1')">1:1</button>
      </div>
    </div>
  </div>

  <!-- ── DESKTOP 3-COL WORKSPACE ─────────── -->
  <div class="workspace">

    <!-- Col 1: Slides -->
    <div class="ws-col col-slides">
      <div class="col-hdr">
        <span class="col-hdr-title">Diák</span>
        <button class="hdr-btn" id="add-menu-btn" onclick="toggleAddMenu()" title="Dia hozzáadása">+</button>
      </div>
      <div class="add-menu" id="add-menu" style="display:none">
        <button onclick="addSlide('cover');toggleAddMenu()">Borító</button>
        <button onclick="addSlide('list');toggleAddMenu()">Lista</button>
        <button onclick="addSlide('quote');toggleAddMenu()">Idézet</button>
        <button onclick="addSlide('content');toggleAddMenu()">Tartalom</button>
        <button onclick="addSlide('closing');toggleAddMenu()">Záró</button>
      </div>
      <div class="slide-thumbs" id="slide-thumbs"></div>
    </div>

    <!-- Col 2: Canvas -->
    <div class="ws-col col-canvas">
      <div class="canvas-inner">
        <div id="preview-wrap"></div>
      </div>
      <div class="canvas-controls">
        <div class="nav-row">
          <button class="nav-btn" id="prev-btn" onclick="navigatePreview(-1)">‹</button>
          <span class="slide-counter" id="slide-counter">1 / 1</span>
          <button class="nav-btn" id="next-btn" onclick="navigatePreview(1)">›</button>
        </div>
        <div class="vrow">
          <span class="ctrl-lbl">Változat</span>
          <button class="v-btn" id="v1-btn" onclick="setVariant(1)">V1</button>
          <button class="v-btn" id="v2-btn" onclick="setVariant(2)">V2</button>
          <button class="v-btn" id="v3-btn" onclick="setVariant(3)">V3</button>
          <button class="v-btn" onclick="randomVariant()" title="Véletlen">🎲</button>
          <button class="v-btn" onclick="shuffleAll()" title="Mindet véletlenre">🔀</button>
          <label class="toggle-wrap">
            <span class="ctrl-lbl">Szám</span>
            <label class="toggle"><input type="checkbox" id="show-nums-toggle" checked onchange="toggleShowNums()"><span class="toggle-slider"></span></label>
          </label>

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function wrap(text, fontSize, maxPxWidth) {
  if (maxPxWidth === undefined) maxPxWidth = 920;
  const charsPerLine = Math.floor(maxPxWidth / (fontSize * 0.54));
  return String(text||'').split(' ').reduce((acc, word) => {
    if (!acc.length) return [word];
    const last = acc[acc.length-1];
    return (last+' '+word).length <= charsPerLine
      ? [...acc.slice(0,-1), last+' '+word]
      : [...acc, word];
  }, []);
}

function dynFs(text, base, min, max, charsAtBase) {
  if (charsAtBase === undefined) charsAtBase = 20;
  const len = String(text||'').length;
  return Math.round(Math.min(max, Math.max(min, base * (charsAtBase / Math.max(len, charsAtBase)))));
}

function manualFs(slide, sizeKey, autoFs, sizes) {

  ).join('');
}

function renderIcon(name, cx, cy, size, color, opacity, strokeWidth) {
  if (opacity === undefined) opacity = 1;
  if (strokeWidth === undefined) strokeWidth = 4;
  if (!ICONS[name]) return '';
  const scale = size/24;
  return `<g transform="translate(${cx-size/2} ${cy-size/2}) scale(${scale})" stroke="${color}" stroke-width="${strokeWidth/scale}" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="${opacity}">${ICONS[name]}</g>`;
}

function calcBodyFs(availableHeight, bodyText, maxW, lh) {
  if (lh === undefined) lh = 1.65;
  for (let fs=78; fs>=44; fs-=2) {
    if (wrap(bodyText, fs, maxW).length * fs * lh <= availableHeight) return fs;
  }
  return 44;
}

// ─────────────────────────────────────────
// getProcessed
// ─────────────────────────────────────────
function getProcessed() {
  const numerable = ['list','content'];
  let count = 0;
  const total = state.slides.filter(s => numerable.includes(s.type)).length;
  return state.slides.map(s => {
    if (numerable.includes(s.type)) {
      count++;
      return {...s, slideNum: `${count} / ${total}`};
    }
    return {...s};
  });
}

// ─────────────────────────────────────────
// COVER renderer
// ─────────────────────────────────────────
function renderCover(slide, W, H, p) {
  const v = slide.variant || 1;
  const icon = slide.icon || 'sparkle';
  const title = slide.title || 'Cím';
  const subtitle = slide.subtitle || '';

  if (v === 1) {
    const titleFs = dynFs(title, 120, 64, 140, 12);
    const titleLines = wrap(title, titleFs, W - PAD*2.5);
    const iconY = H * 0.28;
    const titleY = H * 0.5;
    const actualTitleH = titleLines.length * titleFs * 1.2;
    const subtitleY = titleY + actualTitleH + 48;
    const subFs = 44;
    const subLines = wrap(subtitle, subFs, W - PAD*3);
    const pillH = subLines.length * subFs * 1.4 + 32;
    const pillW = Math.max(...subLines.map(l => l.length * subFs * 0.52), 200) + 80;
    return `
      <circle cx="${W}" cy="0" r="240" fill="${p.primarySoft}" opacity="0.5"/>
      <circle cx="0" cy="${H}" r="200" fill="${p.accentSoft}" opacity="0.45"/>
      ${renderIcon(icon, W/2, iconY, 100, p.primary, 0.25, 2.5)}
      ${renderIcon(icon, W/2, iconY, 72, p.primary, 1, 2.5)}
      ${T(titleLines, W/2, titleY, titleFs, 1.2, p.text, '800', 'middle')}
      ${subtitle ? `
        <rect x="${W/2 - pillW/2}" y="${subtitleY - subFs*0.85}" width="${pillW}" height="${pillH}" rx="9999" fill="${p.accent}" opacity="0.18"/>
        ${T(subLines, W/2, subtitleY, subFs, 1.4, p.accent, '700', 'middle')}
      ` : ''}
      ${hdl(W, H, p.textSoft)}
    `;
  } else if (v === 2) {
    const titleFs = dynFs(title, 110, 60, 130, 14);
    const titleLines = wrap(title, titleFs, W - PAD*2.2 - 80);
    const iconSize = 72;
    const iconX = PAD + iconSize/2;
    const iconY = PAD + iconSize/2 + 20;
    const titleY = iconY + iconSize/2 + 60;
    return `
      <circle cx="${W * 0.82}" cy="${H * 0.45}" r="220" fill="${p.primarySoft}" opacity="0.3"/>
      ${renderIcon(icon, iconX, iconY, iconSize, p.primary, 1, 2.5)}
      <line x1="${PAD + iconSize + 20}" y1="${iconY}" x2="${W - PAD}" y2="${iconY}" stroke="${p.primary}" stroke-width="4" opacity="0.4"/>
      ${T(titleLines, PAD, titleY, titleFs, 1.2, p.text, '800', 'start')}
      ${subtitle ? T(wrap(subtitle, 46, W - PAD*2.2), PAD, titleY + titleLines.length * titleFs * 1.2 + 32, 46, 1.4, p.accent, '700', 'start') : ''}
      ${hdl(W, H, p.textSoft, 'start')}
    `;
  } else {
    // V3: title in rounded box
    const titleFs = dynFs(title, 100, 58, 120, 14);
    const titleLines = wrap(title, titleFs, W - PAD*2.4);
    const boxPadX = 60, boxPadY = 44;
    const boxW = W - PAD*1.6;
    const boxH = titleLines.length * titleFs * 1.25 + boxPadY * 2;
    const boxX = PAD * 0.8;
    const boxY = H * 0.38 - boxH/2;
    const titleTextY = boxY + boxPadY + titleFs * 0.8;
    const iconY = boxY - 70;
    return `
      ${renderIcon(icon, W/2, iconY, 80, p.primary, 1, 2.5)}
      <rect x="${boxX}" y="${boxY}" width="${boxW}" height="${boxH}" rx="24" fill="${p.primarySoft}" opacity="0.7"/>
      ${T(titleLines, W/2, titleTextY, titleFs, 1.25, p.text, '800', 'middle')}
      ${subtitle ? T(wrap(subtitle, 44, W - PAD*2.4), W/2, boxY + boxH + 40, 44, 1.4, p.accent, '700', 'middle') : ''}
      ${hdl(W, H, p.textSoft)}
    `;
  }
}

// ─────────────────────────────────────────
// LIST renderer
// ─────────────────────────────────────────
function renderList(slide, W, H, p) {
  const v = slide.variant || 1;
  const items = slide.items || [];
  const title = slide.title || '';
  const icon = slide.icon || 'star';
  const showNum = state.showNums && slide.slideNum;

  const titleFs = 52;
  const titleLines = wrap(title, titleFs, W - PAD*2.2);
  const titleH = titleLines.length * titleFs * 1.25;
  const titleY = PAD + titleFs;

  const availTop = titleY + titleH + 32;
  const availH = H - availTop - 120;

  let iFs = Math.max(34, Math.min(56, Math.floor(availH / (Math.max(items.length, 1) * 1.9))));
  iFs = manualFs(slide, 'itemsSize', iFs, [54, 48, 40, 34]);

  if (v === 1) {
    const circR = Math.max(28, iFs * 0.62);
    const circX = PAD + circR;
    const textX = circX + circR + 22;
    const maxTextW = W - textX - PAD * 0.8;
    const lh = 1.4;

    let curY = availTop;
    let itemSvg = '';
    items.forEach((item, idx) => {
      const lines = wrap(item, iFs, maxTextW);
      const itemH = lines.length * iFs * lh;
      const firstLineY = curY + iFs * 0.8;
      const circCY = curY + iFs * 0.8 - iFs * 0.15;
      itemSvg += `<circle cx="${circX}" cy="${circCY}" r="${circR}" fill="${p.primary}" opacity="0.15"/>`;
      itemSvg += `<circle cx="${circX}" cy="${circCY}" r="${circR}" fill="none" stroke="${p.primary}" stroke-width="2.5" opacity="0.5"/>`;
      itemSvg += `<text x="${circX}" y="${circCY + iFs*0.38}" font-size="${Math.round(iFs*0.72)}" font-weight="800" fill="${p.primary}" text-anchor="middle" font-family="${FF}">${idx+1}</text>`;
      itemSvg += T(lines, textX, firstLineY, iFs, lh, p.text, '600');
      curY += itemH + 20;
    });

    return `
      ${showNum ? `<text x="${W-PAD}" y="${PAD+40}" font-size="34" font-weight="700" fill="${p.textSoft}" text-anchor="end" font-family="${FF}" opacity="0.7">${esc(slide.slideNum)}</text>` : ''}
      ${T(titleLines, PAD, titleY, titleFs, 1.25, p.text, '800')}
      ${itemSvg}
      ${hdl(W, H, p.textSoft, 'start')}
    `;
  } else if (v === 2) {
    const cardPadX = 28, cardPadY = 20;
    const cardW = W - PAD * 2;
    const lh = 1.4;
    let curY = availTop;
    let itemSvg = '';

    items.forEach((item, idx) => {
      const lines = wrap(item, iFs, cardW - cardPadX * 2 - iFs - 20);
      const cardH = lines.length * iFs * lh + cardPadY * 2;
      const alt = idx % 2 === 0;
      const cardFill = alt ? p.primarySoft : p.surface;
      itemSvg += `<rect x="${PAD}" y="${curY}" width="${cardW}" height="${cardH}" rx="14" fill="${cardFill}" opacity="0.7"/>`;
      itemSvg += `<text x="${PAD + cardPadX}" y="${curY + cardPadY + iFs*0.78}" font-size="${Math.round(iFs*0.72)}" font-weight="800" fill="${p.primary}" font-family="${FF}" opacity="0.5">${idx+1}.</text>`;
      itemSvg += T(lines, PAD + cardPadX + iFs + 8, curY + cardPadY + iFs*0.78, iFs, lh, p.text, '600');
      curY += cardH + 10;
    });

    return `
      ${showNum ? `<text x="${W-PAD}" y="${PAD+40}" font-size="34" font-weight="700" fill="${p.textSoft}" text-anchor="end" font-family="${FF}" opacity="0.7">${esc(slide.slideNum)}</text>` : ''}
      ${T(titleLines, PAD, titleY, titleFs, 1.25, p.text, '800')}
      ${itemSvg}
      ${hdl(W, H, p.textSoft, 'start')}
    `;
  } else {
    // V3: vertical bar + accent dot
    const barX = PAD;
    const textX = PAD + 28;
    const lh = 1.4;
    let curY = availTop;
    let itemSvg = '';
    const totalH = items.reduce((acc, item) => {
      return acc + wrap(item, iFs, W - textX - PAD * 0.8).length * iFs * lh + 16;
    }, 0);
    itemSvg += `<line x1="${barX + 6}" y1="${availTop - 10}" x2="${barX + 6}" y2="${availTop + totalH - 16}" stroke="${p.primary}" stroke-width="3" opacity="0.3"/>`;

    items.forEach((item, idx) => {
      const lines = wrap(item, iFs, W - textX - PAD * 0.8);
      const itemH = lines.length * iFs * lh;
      const dotY = curY + iFs * 0.75;
      itemSvg += `<circle cx="${barX + 6}" cy="${dotY}" r="9" fill="${p.accent}" opacity="0.9"/>`;
      itemSvg += T(lines, textX + 18, curY + iFs * 0.78, iFs, lh, p.text, '600');
      curY += itemH + 16;
    });

    return `
      ${showNum ? `<text x="${W-PAD}" y="${PAD+40}" font-size="34" font-weight="700" fill="${p.textSoft}" text-anchor="end" font-family="${FF}" opacity="0.7">${esc(slide.slideNum)}</text>` : ''}
      ${T(titleLines, PAD, titleY, titleFs, 1.25, p.text, '800')}
      ${itemSvg}
      ${hdl(W, H, p.textSoft, 'start')}
    `;
  }
}

// ─────────────────────────────────────────
// QUOTE renderer
// ─────────────────────────────────────────
function renderQuote(slide, W, H, p) {
  const v = slide.variant || 1;
  const text = slide.text || '';
  const attribution = slide.attribution || '';
  const icon = slide.icon || 'heart';

  let qFs = Math.round(Math.min(140, Math.max(52, 110*(20/Math.max(text.length, 20)))));
  for (let i = 0; i < 6; i++) {
    if (wrap(text, qFs, W - PAD*2).length * qFs * 1.3 < H * 0.58) break;
    qFs = Math.round(qFs * 0.88);
  }
  qFs = manualFs(slide, 'textSize', qFs, [130, 100, 78, 60]);

  const qLines = wrap(text, qFs, W - PAD*2.2);
  const attrFs = Math.max(36, qFs * 0.52);

  if (v === 1) {
    const totalH = qLines.length * qFs * 1.3 + attrFs * 2;
    const startY = H/2 - totalH/2 + qFs;
    return `
      <rect width="${W}" height="${H}" fill="${p.primary}"/>
      ${renderIcon(icon, W * 0.85, H * 0.15, 180, p.white, 0.07, 1.5)}
      <text x="${PAD * 0.8}" y="${startY - qFs * 0.5}" font-size="${qFs*3.5}" font-weight="800" fill="${p.white}" opacity="0.12" font-family="${FF}">"</text>
      ${T(qLines, W/2, startY, qFs, 1.3, p.white, '700', 'middle')}
      ${attribution ? `<text x="${W/2}" y="${startY + qLines.length * qFs * 1.3 + attrFs * 1.3}" font-size="${attrFs}" font-weight="600" fill="${p.white}" text-anchor="middle" opacity="0.7" font-family="${FF}">${esc(attribution)}</text>` : ''}
      ${hdl(W, H, p.white, 'middle', 0.6)}
    `;
  } else if (v === 2) {
    const boxPad = 56;
    const boxW = W - PAD * 1.4;
    const boxH = qLines.length * qFs * 1.3 + boxPad * 2 + (attribution ? attrFs * 2.5 : 0);
    const boxX = PAD * 0.7;
    const boxY = H/2 - boxH/2;
    const textStartY = boxY + boxPad + qFs * 0.85;
    return `
      <rect x="${boxX}" y="${boxY}" width="${boxW}" height="${boxH}" rx="24" fill="${p.primarySoft}" opacity="0.7"/>
      <rect x="${boxX}" y="${boxY}" width="${boxW}" height="${boxH}" rx="24" fill="none" stroke="${p.primary}" stroke-width="2.5" opacity="0.25"/>
      <text x="${boxX + 32}" y="${boxY + boxPad * 0.7}" font-size="${qFs*2.2}" font-weight="800" fill="${p.primary}" opacity="0.2" font-family="${FF}">"</text>
      ${T(qLines, W/2, textStartY, qFs, 1.3, p.text, '700', 'middle')}
      ${attribution ? `<text x="${W/2}" y="${textStartY + qLines.length * qFs * 1.3 + attrFs * 1.2}" font-size="${attrFs}" font-weight="600" fill="${p.textMid}" text-anchor="middle" opacity="0.8" font-family="${FF}">${esc(attribution)}</text>` : ''}
      ${hdl(W, H, p.textSoft)}
    `;
  } else {
    // V3: left primary bar + icon bottom-right
    const barW = 10;
    const textX = PAD + barW + 28;
    const maxW = W - textX - PAD * 0.8;
    const qLinesV3 = wrap(text, qFs, maxW);
    const totalH = qLinesV3.length * qFs * 1.3;
    const startY = H/2 - totalH/2 + qFs;
    return `
      <rect x="${PAD}" y="${startY - qFs * 1.1}" width="${barW}" height="${totalH + qFs * 0.5}" rx="${barW/2}" fill="${p.primary}" opacity="0.85"/>
      ${T(qLinesV3, textX, startY, qFs, 1.3, p.text, '700')}
      ${attribution ? `<text x="${textX}" y="${startY + qLinesV3.length * qFs * 1.3 + attrFs}" font-size="${attrFs}" font-weight="600" fill="${p.textMid}" opacity="0.8" font-family="${FF}">${esc(attribution)}</text>` : ''}
      ${renderIcon(icon, W - PAD - 50, H - 200, 110, p.accent, 0.18, 2)}
      ${hdl(W, H, p.textSoft, 'start')}
    `;
  }
}

// ─────────────────────────────────────────
// CONTENT renderer
// ─────────────────────────────────────────
function renderContent(slide, W, H, p) {
  const v = slide.variant || 1;
  const title = slide.title || '';
  const body = slide.body || '';
  const icon = slide.icon || 'lightbulb';
  const showNum = state.showNums && slide.slideNum;

  const tFs = manualFs(slide, 'titleSize', dynFs(title, 88, 52, 100, 14), [88, 72, 58, 46]);
  const titleLines = wrap(title, tFs, W - PAD * 2.2);
  const titleY = PAD + tFs + 20;

  const bodyTop = titleY + titleLines.length * tFs * 1.2 + 40;
  const availBodyH = H - bodyTop - 130;
  let bFs = calcBodyFs(availBodyH, body, W - PAD * 2.2);
  bFs = manualFs(slide, 'bodySize', bFs, [78, 64, 52, 42]);
  const bodyLines = wrap(body, bFs, W - PAD * 2.2);

  if (v === 1) {
    const barTop = titleY - tFs * 0.76;
    const barH = titleLines.length * tFs * 1.2 + tFs * 0.36;
    const barX = PAD - 22;
    return `
      ${showNum ? `<text x="${W-PAD}" y="${PAD+44}" font-size="34" font-weight="700" fill="${p.textSoft}" text-anchor="end" font-family="${FF}" opacity="0.7">${esc(slide.slideNum)}</text>` : ''}
      <rect x="${barX}" y="${barTop}" width="10" height="${barH}" rx="5" fill="${p.accent}" opacity="0.85"/>
      ${T(titleLines, PAD, titleY, tFs, 1.2, p.text, '800')}
      ${T(bodyLines, PAD, bodyTop + bFs * 0.8, bFs, 1.65, p.textMid, '400')}
      ${hdl(W, H, p.textSoft, 'start')}
    `;
  } else if (v === 2) {
    const lineY = titleY + titleLines.length * tFs * 1.2 + 16;
    const boxY = lineY + 28;
    const boxPad = 36;
    const boxW = W - PAD * 2;
    const boxH = bodyLines.length * bFs * 1.65 + boxPad * 2;
    return `
      ${showNum ? `<text x="${W-PAD}" y="${PAD+44}" font-size="34" font-weight="700" fill="${p.textSoft}" text-anchor="end" font-family="${FF}" opacity="0.7">${esc(slide.slideNum)}</text>` : ''}
      ${T(titleLines, PAD, titleY, tFs, 1.2, p.text, '800')}
      <line x1="${PAD}" y1="${lineY}" x2="${W - PAD}" y2="${lineY}" stroke="${p.accent}" stroke-width="4" opacity="0.6"/>
      <rect x="${PAD}" y="${boxY}" width="${boxW}" height="${boxH}" rx="16" fill="${p.surface}" opacity="0.8"/>
      ${T(bodyLines, PAD + boxPad, boxY + boxPad + bFs * 0.8, bFs, 1.65, p.textMid, '400')}
      ${hdl(W, H, p.textSoft, 'start')}
    `;
  } else {
    // V3: primary bar + accent circle + ghost icon bg
    const barTop = titleY - tFs * 0.76;
    const barH = titleLines.length * tFs * 1.2 + tFs * 0.36;
    const barX = PAD - 22;
    const accentCX = barX + 4;
    const accentCY = barTop - 18;
    return `
      ${renderIcon(icon, W * 0.8, H * 0.42, 200, p.primary, 0.07, 1.5)}
      ${showNum ? `<text x="${W-PAD}" y="${PAD+44}" font-size="34" font-weight="700" fill="${p.textSoft}" text-anchor="end" font-family="${FF}" opacity="0.7">${esc(slide.slideNum)}</text>` : ''}
      <rect x="${barX}" y="${barTop}" width="10" height="${barH}" rx="5" fill="${p.primary}" opacity="0.85"/>
      <circle cx="${accentCX + 4}" cy="${accentCY}" r="14" fill="${p.accent}" opacity="0.7"/>
      ${T(titleLines, PAD, titleY, tFs, 1.2, p.text, '800')}
      ${T(bodyLines, PAD, bodyTop + bFs * 0.8, bFs, 1.65, p.textMid, '400')}
      ${hdl(W, H, p.textSoft, 'start')}
    `;
  }
}

// ─────────────────────────────────────────
// CLOSING renderer
// ─────────────────────────────────────────
function renderClosing(slide, W, H, p) {
  const v = slide.variant || 1;
  const cta = slide.cta || 'Kövesd az oldalt!';
  const saveText = slide.saveText || '';
  const icon = slide.icon || 'heart';

  const ctaFs = dynFs(cta, 110, 60, 130, 12);
  const ctaLines = wrap(cta, ctaFs, W - PAD * 2.2);
  const saveFs = 50;

  if (v === 1) {
    const ctaY = H * 0.35;
    const actualCtaH = ctaLines.length * ctaFs * 1.25;
    const handlePillY = H - 110;
    const pillW = HANDLE.length * 32 * 0.55 + 80;
    const pillH = 70;
    return `
      <rect x="0" y="0" width="${W}" height="8" rx="4" fill="${p.primary}" opacity="0.7"/>
      <rect x="0" y="0" width="${W}" height="4" fill="${p.accent}" opacity="0.5"/>
      <rect x="0" y="${H-8}" width="${W}" height="8" rx="4" fill="${p.primary}" opacity="0.7"/>
      <rect x="0" y="${H-4}" width="${W}" height="4" fill="${p.accent}" opacity="0.5"/>
      ${renderIcon(icon, W/2, ctaY - 90, 68, p.primary, 1, 2.5)}
      ${T(ctaLines, W/2, ctaY, ctaFs, 1.25, p.text, '800', 'middle')}
      ${saveText ? T(wrap(saveText, saveFs, W - PAD*2.2), W/2, ctaY + actualCtaH + saveFs + 10, saveFs, 1.4, p.textMid, '600', 'middle') : ''}
      <rect x="${W/2 - pillW/2}" y="${handlePillY - pillH*0.75}" width="${pillW}" height="${pillH}" rx="9999" fill="${p.primary}" opacity="0.15"/>
      <rect x="${W/2 - pillW/2}" y="${handlePillY - pillH*0.75}" width="${pillW}" height="${pillH}" rx="9999" fill="none" stroke="${p.primary}" stroke-width="2.5" opacity="0.4"/>
      ${hdl(W, H, p.primary)}
    `;
  } else if (v === 2) {
    const bandH = H * 0.42;
    const ctaY = bandH * 0.52 + ctaFs;
    const actualCtaH = ctaLines.length * ctaFs * 1.25;
    return `
      <rect width="${W}" height="${bandH}" fill="${p.primary}"/>
      ${renderIcon(icon, W * 0.88, bandH * 0.3, 160, p.white, 0.1, 2)}
      ${T(ctaLines, W/2, ctaY, ctaFs, 1.25, p.white, '800', 'middle')}
      ${saveText ? T(wrap(saveText, saveFs, W - PAD*2.2), W/2, bandH + saveFs + 40, saveFs, 1.4, p.textMid, '600', 'middle') : ''}
      ${hdl(W, H, p.primary)}
    `;
  } else {
    // V3: CTA + accent divider + handle pill
    const ctaY = H * 0.32 + ctaFs;
    const actualCtaH = ctaLines.length * ctaFs * 1.25;
    const divY = ctaY + actualCtaH + 40;
    const handleY = divY + 80;
    const pillW = HANDLE.length * 32 * 0.55 + 80;
    const pillH = 70;
    return `
      ${renderIcon(icon, W/2, H * 0.14, 70, p.primary, 1, 2.5)}
      ${T(ctaLines, W/2, ctaY, ctaFs, 1.25, p.text, '800', 'middle')}
      ${saveText ? T(wrap(saveText, saveFs, W - PAD*2.2), W/2, ctaY + actualCtaH + 16, saveFs, 1.4, p.textMid, '600', 'middle') : ''}
      <line x1="${W/2 - 80}" y1="${divY}" x2="${W/2 + 80}" y2="${divY}" stroke="${p.accent}" stroke-width="4" opacity="0.7"/>
      <circle cx="${W/2}" cy="${divY}" r="6" fill="${p.accent}" opacity="0.9"/>
      <rect x="${W/2 - pillW/2}" y="${handleY - pillH*0.75}" width="${pillW}" height="${pillH}" rx="9999" fill="${p.primary}" opacity="0.12"/>
      <rect x="${W/2 - pillW/2}" y="${handleY - pillH*0.75}" width="${pillW}" height="${pillH}" rx="9999" fill="none" stroke="${p.primary}" stroke-width="2.5" opacity="0.5"/>
      ${hdl(W, H, p.primary)}
    `;
  }
}

// ─────────────────────────────────────────
// Main renderSlide dispatcher
// ─────────────────────────────────────────
function renderSlide(slide, W, H, palette) {
  try {
    const bg = `<rect width="${W}" height="${H}" fill="${palette.bg}"/>`;
    switch(slide.type) {
      case 'cover':   return bg + renderCover(slide, W, H, palette);
      case 'list':    return bg + renderList(slide, W, H, palette);
      case 'quote':   return bg + renderQuote(slide, W, H, palette);
      case 'content': return bg + renderContent(slide, W, H, palette);
      case 'closing': return bg + renderClosing(slide, W, H, palette);
      default:        return bg;
    }
  } catch(e) {
    console.error('renderSlide error', e);
    return `<rect width="${W}" height="${H}" fill="#eee"/><text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="40" fill="#999" font-family="${FF}">Render error</text>`;
  }
}

function mkSVGFull(slide, W, H, palette) {
  return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');</style></defs>
  ${renderSlide(slide, W, H, palette)}
</svg>`;
}


// ─────────────────────────────────────────
// CRC32 & ZIP builder
// ─────────────────────────────────────────
function _crc32(data) {
  const table = _crc32.table || (_crc32.table = (() => {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[i] = c;
    }
    return t;
  })());
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < data.length; i++) crc = table[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function makeZip(files) {
  const enc = new TextEncoder();
  const localHeaders = [];
  const centralDir = [];
  let offset = 0;

  for (const file of files) {
    const nameBytes = enc.encode(file.name);
    const data = file.content;
    const crc = _crc32(data);
    const dosDate = 0x5421; // 2022-01-01
    const dosTime = 0x0000;

    // Local file header
    const lh = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); // signature
    lv.setUint16(4, 20, true);         // version needed
    lv.setUint16(6, 0, true);          // flags
    lv.setUint16(8, 0, true);          // compression: stored
    lv.setUint16(10, dosTime, true);
    lv.setUint16(12, dosDate, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, data.length, true);
    lv.setUint32(22, data.length, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    lh.set(nameBytes, 30);

    localHeaders.push({lh, data});

    // Central directory entry
    const cd = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true); // signature
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, dosTime, true);
    cv.setUint16(14, dosDate, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    cd.set(nameBytes, 46);
    centralDir.push(cd);

    offset += lh.length + data.length;
  }

  const cdOffset = offset;
  const cdSize = centralDir.reduce((s, c) => s + c.length, 0);

  // End of central directory
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, cdOffset, true);
  ev.setUint16(20, 0, true);

  const total = localHeaders.reduce((s, f) => s + f.lh.length + f.data.length, 0) + cdSize + eocd.length;
  const out = new Uint8Array(total);
  let pos = 0;
  for (const f of localHeaders) {
    out.set(f.lh, pos); pos += f.lh.length;
    out.set(f.data, pos); pos += f.data.length;
  }
  for (const c of centralDir) { out.set(c, pos); pos += c.length; }
  out.set(eocd, pos);
  return out;
}

// ─────────────────────────────────────────
// PNG export helpers
// ─────────────────────────────────────────
function svgToPNG(svgString, W, H) {
  return new Promise((resolve, reject) => {
    const scale = 2;
    const canvas = document.createElement('canvas');
    canvas.width = W * scale;
    canvas.height = H * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);

    const blob = new Blob([svgString], {type: 'image/svg+xml'});
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, 0, 0, W, H);
      URL.revokeObjectURL(url);
      canvas.toBlob(b => b ? resolve(b) : reject('canvas toBlob failed'), 'image/png');
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject('img load failed'); };
    img.src = url;
  });
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ─────────────────────────────────────────
// Download actions
// ─────────────────────────────────────────
async function downloadCurrentSVG() {
  const slides = getProcessed();
  const slide = slides[state.cur];
  if (!slide) return;
  const [W, H] = DIMS[state.ratio];
  const palette = PALETTES[state.stilus] || PALETTES.termeszetes;
  const svgStr = mkSVGFull(slide, W, H, palette);
  const blob = new Blob([svgStr], {type: 'image/svg+xml'});
  downloadBlob(blob, `slide-${state.cur + 1}.svg`);
  toast('SVG letöltve!');
}

async function downloadCurrentPNG() {
  if (state.pngRunning) return;
  const slides = getProcessed();
  const slide = slides[state.cur];
  if (!slide) return;
  const [W, H] = DIMS[state.ratio];
  const palette = PALETTES[state.stilus] || PALETTES.termeszetes;
  const svgStr = mkSVGFull(slide, W, H, palette);

  if (isIOS) {
    try {
      const blob = await svgToPNG(svgStr, W, H);
      const url = URL.createObjectURL(blob);
      showIOSModal([{url, name: `slide-${state.cur + 1}.png`}], false);
    } catch(e) { toast('Hiba a PNG generáláskor'); }
    return;
  }

  state.pngRunning = true;
  const curBtn = document.getElementById('png-cur-btn') || document.getElementById('m-png-cur-btn');
  if (curBtn) curBtn.textContent = 'Generálás...';
  try {
    const blob = await svgToPNG(svgStr, W, H);
    downloadBlob(blob, `slide-${state.cur + 1}.png`);
    toast('PNG letöltve!');
  } catch(e) { toast('Hiba a PNG generáláskor'); }
  state.pngRunning = false;
  if (curBtn) curBtn.textContent = 'PNG';
}

async function downloadAllSVG() {
  const slides = getProcessed();
  const [W, H] = DIMS[state.ratio];
  const palette = PALETTES[state.stilus] || PALETTES.termeszetes;
  const enc = new TextEncoder();
  const files = slides.map((slide, i) => ({
    name: `slide-${String(i+1).padStart(2,'0')}.svg`,
    content: enc.encode(mkSVGFull(slide, W, H, palette))
  }));
  const zip = makeZip(files);
  const blob = new Blob([zip], {type: 'application/zip'});
  downloadBlob(blob, 'carousel-slides.zip');
  toast('SVG ZIP letöltve!');
}

async function downloadAllPNG() {
  if (state.pngRunning) return;
  state.pngRunning = true;
  const slides = getProcessed();
  const [W, H] = DIMS[state.ratio];
  const palette = PALETTES[state.stilus] || PALETTES.termeszetes;

  const progressWrap = document.getElementById('progress-wrap') || document.getElementById('m-progress-wrap');
  const progressBar = document.getElementById('progress-bar') || document.getElementById('m-progress-bar');
  if (progressWrap) progressWrap.style.display = '';
  if (progressBar) progressBar.style.width = '0%';

  const btn = document.getElementById('png-all-btn') || document.getElementById('m-png-all-btn');
  if (btn) btn.textContent = 'Generálás...';

  if (isIOS) {
    const urls = [];
    for (let i = 0; i < slides.length; i++) {
      const svgStr = mkSVGFull(slides[i], W, H, palette);
      try {
        const blob = await svgToPNG(svgStr, W, H);
        urls.push({url: URL.createObjectURL(blob), name: `slide-${i+1}.png`});
      } catch(e) {}
      if (progressBar) progressBar.style.width = `${Math.round((i+1)/slides.length*100)}%`;
    }
    state.pngRunning = false;
    if (btn) btn.textContent = 'PNG ZIP letöltés';
    if (progressWrap) progressWrap.style.display = 'none';
    showIOSModal(urls, true);
    return;
  }

  try {
    const pngFiles = [];
    for (let i = 0; i < slides.length; i++) {
      const svgStr = mkSVGFull(slides[i], W, H, palette);
      const blob = await svgToPNG(svgStr, W, H);
      const buf = await blob.arrayBuffer();
      pngFiles.push({
        name: `slide-${String(i+1).padStart(2,'0')}.png`,
        content: new Uint8Array(buf)
      });
      if (progressBar) progressBar.style.width = `${Math.round((i+1)/slides.length*100)}%`;
    }
    const zip = makeZip(pngFiles);
    const blob2 = new Blob([zip], {type: 'application/zip'});
    downloadBlob(blob2, 'carousel-slides-png.zip');
    toast('PNG ZIP letöltve!');
  } catch(e) { toast('Hiba a PNG generáláskor'); }

  state.pngRunning = false;
  if (btn) btn.textContent = 'PNG ZIP letöltés';
  if (progressWrap) progressWrap.style.display = 'none';
}

// ─────────────────────────────────────────
// iOS Modal
// ─────────────────────────────────────────
function showIOSModal(items, isGallery) {
  const modal = document.getElementById('ios-modal');
  const body = document.getElementById('modal-body');
  const instr = document.getElementById('modal-instruction');
  body.innerHTML = '';
  if (isGallery) {
    instr.textContent = 'Nyomj hosszan minden képre → Kép mentése';
    const hint = document.createElement('div');
    hint.className = 'modal-scroll-hint';
    hint.textContent = `${items.length} kép — görgess le mindegyikhez`;
    body.appendChild(hint);
    for (const item of items) {
      const img = document.createElement('img');
      img.src = item.url;
      body.appendChild(img);
    }
  } else {
    instr.textContent = 'Nyomj hosszan → Kép mentése';
    const img = document.createElement('img');
    img.src = items[0].url;
    body.appendChild(img);
  }
  modal.style.display = 'flex';
}

function closeModal() {
  document.getElementById('ios-modal').style.display = 'none';
}

  const collapsed = body.classList.toggle('collapsed');

function toggleAddMenu() {

  menu.classList.toggle('open');
  menu.style.display = menu.classList.contains('open') ? 'flex' : 'none';
}

// ─────────────────────────────────────────
// JSON panel
// ─────────────────────────────────────────
function _parseAndLoad(raw) {
  const parsed = JSON.parse(raw);
  if (parsed.slides && Array.isArray(parsed.slides)) state.slides = parsed.slides;
  if (parsed.stilus && PALETTES[parsed.stilus]) state.stilus = parsed.stilus;
  if (parsed.ratio && DIMS[parsed.ratio]) state.ratio = parsed.ratio;
  state.cur = 0;
}

function loadJSON() {
  try {
    _parseAndLoad(document.getElementById('json-area').value.trim());
    renderAll(); toast('JSON betöltve!');
  } catch(e) { toast('Hibás JSON formátum!'); }
}

function exportJSON() {
  const out = JSON.stringify({slides: state.slides, stilus: state.stilus, ratio: state.ratio}, null, 2);
  const el = document.getElementById('json-area');
  if (el) el.value = out;
  const mel = document.getElementById('m-json-area');
  if (mel) mel.value = out;
  toast('JSON exportálva!');
}

function loadJSONMob() {
  try {
    _parseAndLoad(document.getElementById('m-json-area').value.trim());
    const el = document.getElementById('json-area');
    if (el) el.value = document.getElementById('m-json-area').value;
    renderAll(); toast('JSON betöltve!');
  } catch(e) { toast('Hibás JSON formátum!'); }
}

function exportJSONMob() {
  exportJSON();
}

// ─────────────────────────────────────────
// Slide list helpers
// ─────────────────────────────────────────
function typePreviewText(slide) {
  switch(slide.type) {
    case 'cover': return slide.title || '(nincs cím)';
    case 'list': return slide.title || (slide.items && slide.items[0]) || '(nincs elem)';
    case 'quote': return slide.text || '(nincs idézet)';
    case 'content': return slide.title || '(nincs cím)';
    case 'closing': return slide.cta || '(nincs CTA)';
    default: return slide.type;
  }
}

let dragSrcIdx = null;

// Desktop: slide thumbnail cards in col-slides
function renderSlideThumbs() {
  const container = document.getElementById('slide-thumbs');
  if (!container) return;
  container.innerHTML = '';
  const slides = getProcessed();
  const [W, H] = DIMS[state.ratio];
  const palette = PALETTES[state.stilus] || PALETTES.termeszetes;

  slides.forEach((slide, i) => {
    const card = document.createElement('div');
    card.className = 'thumb-card' + (i === state.cur ? ' active' : '');
    const content = renderSlide(slide, W, H, palette);
    card.innerHTML = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">${content}</svg>
      <div class="thumb-lbl"><span>${slide.type}</span><span>${i+1}</span></div>
      <button class="thumb-del-btn" onclick="event.stopPropagation();deleteSlide(${i})">✕</button>
    `;
    card.addEventListener('click', () => { state.cur = i; renderAll(); });
    card.draggable = true;
    card.addEventListener('dragstart', e => { dragSrcIdx = i; e.dataTransfer.effectAllowed = 'move'; card.style.opacity = '0.45'; });
    card.addEventListener('dragend', () => { card.style.opacity = ''; card.classList.remove('drag-over'); });
    card.addEventListener('dragover', e => { e.preventDefault(); card.classList.add('drag-over'); });
    card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
    card.addEventListener('drop', e => {
      e.preventDefault(); card.classList.remove('drag-over');
      if (dragSrcIdx === null || dragSrcIdx === i) return;
      const moved = state.slides.splice(dragSrcIdx, 1)[0];
      state.slides.splice(i, 0, moved);
      state.cur = i; dragSrcIdx = null;
      renderAll();
    });
    container.appendChild(card);
  });
}

// Mobile: simple list rows
function renderMobileSlideList() {
  const list = document.getElementById('m-slide-list');
  if (!list) return;
  list.innerHTML = '';
  state.slides.forEach((slide, i) => {
    const row = document.createElement('div');
    row.className = 'm-slide-row' + (i === state.cur ? ' active' : '');
    row.draggable = true;
    row.innerHTML = `
      <span class="drag-handle">⠿</span>
      <span class="type-badge badge-${slide.type||'cover'}">${slide.type}</span>
      <span class="slide-preview-text">${typePreviewText(slide)}</span>
      <span style="font-size:11px;color:var(--c-soft);flex-shrink:0">${i+1}</span>
      <button class="m-del-btn" onclick="event.stopPropagation();deleteSlide(${i})">✕</button>
    `;
    row.addEventListener('click', e => {
      if (e.target.classList.contains('m-del-btn')) return;
      state.cur = i;
      renderMobileSlideList();
      renderSlideEditor('m-slide-editor');
      renderMiniPreview();
    });
    row.addEventListener('dragstart', e => { dragSrcIdx = i; e.dataTransfer.effectAllowed = 'move'; row.style.opacity = '0.4'; });
    row.addEventListener('dragend', () => { row.style.opacity = ''; row.classList.remove('drag-over'); });
    row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('drag-over'); });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', e => {
      e.preventDefault(); row.classList.remove('drag-over');
      if (dragSrcIdx === null || dragSrcIdx === i) return;
      const moved = state.slides.splice(dragSrcIdx, 1)[0];
      state.slides.splice(i, 0, moved);
      state.cur = i; dragSrcIdx = null;
      renderMobileSlideList();
      renderMiniPreview();
    });
    list.appendChild(row);
  });
}

function addSlide(type) {
  const defaults = {
    cover: {type:'cover',variant:1,icon:'sparkle',title:'Új borító',subtitle:''},
    list: {type:'list',variant:1,icon:'star',title:'Új lista',items:['1. elem','2. elem','3. elem']},
    quote: {type:'quote',variant:1,icon:'heart',text:'Idézet szövege',attribution:'— Szerző'},
    content: {type:'content',variant:1,icon:'lightbulb',title:'Új tartalom',body:'A tartalom szövege itt jelenik meg.'},
    closing: {type:'closing',variant:1,icon:'heart',cta:'Kövesd az oldalt!',saveText:''}
  };
  state.slides.push({...defaults[type]});
  state.cur = state.slides.length - 1;
  renderAll();
  toast(`${type} dia hozzáadva`);
}

function deleteSlide(i) {
  if (state.slides.length <= 1) { toast('Legalább egy dia szükséges!'); return; }
  state.slides.splice(i, 1);
  state.cur = Math.min(state.cur, state.slides.length - 1);
  renderAll();
  toast('Dia törölve');
}

// ─────────────────────────────────────────
// Icon grid builder
// ─────────────────────────────────────────
function buildIconGrid(currentIcon, onSelect) {
  const grid = document.createElement('div');
  grid.className = 'icon-grid';
  Object.keys(ICONS).forEach(name => {
    const cell = document.createElement('div');
    cell.className = 'icon-cell' + (name === currentIcon ? ' active' : '');
    cell.title = name;
    cell.innerHTML = `<svg viewBox="0 0 24 24">${ICONS[name]}</svg>`;
    cell.addEventListener('click', () => {
      onSelect(name);
      grid.querySelectorAll('.icon-cell').forEach(c => c.classList.remove('active'));
      cell.classList.add('active');
    });
    grid.appendChild(cell);
  });
  return grid;
}

// ─────────────────────────────────────────
// Slide editor (renders into targetId)
// ─────────────────────────────────────────
function renderSlideEditor(targetId) {
  if (!targetId) targetId = 'slide-editor-body';
  const body = document.getElementById(targetId);
  if (!body) return;
  const slide = state.slides[state.cur];
  if (!slide) { body.innerHTML = '<p style="color:var(--c-soft);font-size:12px;padding:8px">Nincs kiválasztott dia.</p>'; return; }
  body.innerHTML = '';

  const update = (key, val) => { state.slides[state.cur][key] = val; renderMiniPreview(); renderSlideThumbs(); };

  // Type chips
  const typeGroup = mkFieldGroup('Típus');
  const typeChips = document.createElement('div');
  typeChips.className = 'chips';
  ['cover','list','quote','content','closing'].forEach(t => {
    const chip = mkChip(t, t === slide.type, () => {
      const old = state.slides[state.cur];
      const defaults = {
        cover: {type:'cover',variant:1,icon:old.icon||'sparkle',title:old.title||'Borító',subtitle:''},
        list: {type:'list',variant:1,icon:old.icon||'star',title:old.title||'Lista',items:['1. elem']},
        quote: {type:'quote',variant:1,icon:old.icon||'heart',text:old.text||'Idézet',attribution:''},
        content: {type:'content',variant:1,icon:old.icon||'lightbulb',title:old.title||'Tartalom',body:old.body||''},
        closing: {type:'closing',variant:1,icon:old.icon||'heart',cta:'Kövesd az oldalt!',saveText:''}
      };
      state.slides[state.cur] = defaults[t];
      renderSlideEditor(targetId);
      renderMiniPreview();
    });
    typeChips.appendChild(chip);
  });
  typeGroup.appendChild(typeChips);
  body.appendChild(typeGroup);

  // Variant chips
  const varGroup = mkFieldGroup('Változat');
  const varChips = document.createElement('div');
  varChips.className = 'chips';
  [1,2,3].forEach(v => {
    varChips.appendChild(mkChip('V'+v, (slide.variant||1) === v, () => { update('variant', v); renderSlideEditor(targetId); }));
  });
  varGroup.appendChild(varChips);
  body.appendChild(varGroup);

  // Type-specific fields
  if (slide.type === 'cover') {
    body.appendChild(mkTextInput('Cím', slide.title||'', v => update('title', v)));
    body.appendChild(mkTextInput('Alcím', slide.subtitle||'', v => update('subtitle', v)));
  } else if (slide.type === 'list') {
    body.appendChild(mkTextInput('Cím', slide.title||'', v => update('title', v)));
    body.appendChild(mkItemsEditor(slide, update));
    body.appendChild(mkSizeChips('Elemek mérete', slide, 'itemsSize', update));
  } else if (slide.type === 'quote') {
    body.appendChild(mkTextarea('Idézet', slide.text||'', v => update('text', v)));
    body.appendChild(mkTextInput('Forrás', slide.attribution||'', v => update('attribution', v)));
    body.appendChild(mkSizeChips('Szöveg mérete', slide, 'textSize', update));
  } else if (slide.type === 'content') {
    body.appendChild(mkTextInput('Cím', slide.title||'', v => update('title', v)));
    body.appendChild(mkTextarea('Tartalom', slide.body||'', v => update('body', v)));
    body.appendChild(mkSizeChips('Cím mérete', slide, 'titleSize', update));
    body.appendChild(mkSizeChips('Szöveg mérete', slide, 'bodySize', update));
  } else if (slide.type === 'closing') {
    body.appendChild(mkTextInput('CTA szöveg', slide.cta||'', v => update('cta', v)));
    body.appendChild(mkTextInput('Mentési szöveg', slide.saveText||'', v => update('saveText', v)));
  }

  // Icon selector
  const iconGroup = mkFieldGroup('Ikon');
  iconGroup.appendChild(buildIconGrid(slide.icon, name => { update('icon', name); }));
  body.appendChild(iconGroup);
}

function mkFieldGroup(label) {
  const g = document.createElement('div');
  g.className = 'field-group';
  const l = document.createElement('div');
  l.className = 'field-label';
  l.textContent = label;
  g.appendChild(l);
  return g;
}

function mkChip(label, active, onClick) {
  const c = document.createElement('button');
  c.className = 'chip' + (active ? ' active' : '');
  c.textContent = label;
  c.onclick = onClick;
  return c;
}

function mkTextInput(label, value, onChange) {
  const g = mkFieldGroup(label);
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'field-input';
  inp.value = value;
  inp.addEventListener('input', () => onChange(inp.value));
  g.appendChild(inp);
  return g;
}

function mkTextarea(label, value, onChange) {
  const g = mkFieldGroup(label);
  const ta = document.createElement('textarea');
  ta.className = 'field-input';
  ta.value = value;
  ta.rows = 3;
  ta.addEventListener('input', () => onChange(ta.value));
  g.appendChild(ta);
  return g;
}

function mkSizeChips(label, slide, key, update) {
  const g = mkFieldGroup(label);
  const chips = document.createElement('div');
  chips.className = 'chips';
  ['auto','xl','l','m','s'].forEach(sz => {
    const val = sz === 'auto' ? undefined : sz;
    const active = (slide[key] || undefined) === val;
    const chip = mkChip(sz === 'auto' ? 'Auto' : sz.toUpperCase(), active, () => {
      update(key, val);
      chips.querySelectorAll('.chip').forEach((c,i) => c.classList.toggle('active', i === ['auto','xl','l','m','s'].indexOf(sz)));
    });
    chips.appendChild(chip);
  });
  g.appendChild(chips);
  return g;
}

function mkItemsEditor(slide, update) {
  const g = mkFieldGroup('Lista elemek');
  let dragItemSrc = null;

  const renderItems = () => {
    list.innerHTML = '';
    (slide.items || []).forEach((item, i) => {
      const row = document.createElement('div');
      row.className = 'item-row';
      row.draggable = true;
      row.innerHTML = `<span class="drag-handle">⠿</span>`;
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'field-input';
      inp.value = item;
      inp.addEventListener('input', () => { slide.items[i] = inp.value; update('items', slide.items); });
      const del = document.createElement('button');
      del.className = 'item-del';
      del.textContent = '✕';
      del.onclick = () => { slide.items.splice(i, 1); update('items', slide.items); renderItems(); };
      row.appendChild(inp);
      row.appendChild(del);

      row.addEventListener('dragstart', () => { dragItemSrc = i; row.style.opacity = '0.4'; });
      row.addEventListener('dragend', () => { row.style.opacity = '1'; });
      row.addEventListener('dragover', (e) => { e.preventDefault(); row.style.background = 'var(--c-greenBg)'; });
      row.addEventListener('dragleave', () => { row.style.background = ''; });
      row.addEventListener('drop', (e) => {
        e.preventDefault(); row.style.background = '';
        if (dragItemSrc === null || dragItemSrc === i) return;
        const moved = slide.items.splice(dragItemSrc, 1)[0];
        slide.items.splice(i, 0, moved);
        dragItemSrc = null;
        update('items', slide.items);
        renderItems();
      });

      list.appendChild(row);
    });
  };

  const list = document.createElement('div');
  list.className = 'items-list';
  renderItems();
  g.appendChild(list);

  const addBtn = document.createElement('button');
  addBtn.className = 'btn btn-sm';
  addBtn.textContent = '+ Elem hozzáadása';
  addBtn.onclick = () => {
    if (!slide.items) slide.items = [];
    slide.items.push('Új elem');
    update('items', slide.items);
    renderItems();
  };
  g.appendChild(addBtn);
  return g;
}

// ─────────────────────────────────────────
// Mini preview
// ─────────────────────────────────────────
function renderMiniPreview() {
  const wrap = document.getElementById('mini-preview-wrap');
  if (!wrap) return;
  const slide = getProcessed()[state.cur];
  if (!slide) { wrap.innerHTML = ''; return; }
  const [W, H] = DIMS[state.ratio];
  const palette = PALETTES[state.stilus] || PALETTES.termeszetes;
  const content = renderSlide(slide, W, H, palette);
  wrap.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">${content}</svg>`;
}

// ─────────────────────────────────────────
// Preview rendering
// ─────────────────────────────────────────
function renderPreviewTab() {
  const slides = getProcessed();
  const slide = slides[state.cur];
  const [W, H] = DIMS[state.ratio];
  const palette = PALETTES[state.stilus] || PALETTES.termeszetes;

  // Desktop preview
  const wrap = document.getElementById('preview-wrap');
  if (wrap && slide) {
    const content = renderSlide(slide, W, H, palette);
    wrap.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" style="display:block;">${content}</svg>`;
  }

  // Mobile preview
  const mwrap = document.getElementById('m-preview-wrap');
  if (mwrap && slide) {
    const content = renderSlide(slide, W, H, palette);
    mwrap.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">${content}</svg>`;
  }

  const total = slides.length;
  const cur1 = state.cur + 1;
  ['slide-counter','m-slide-counter'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = `${cur1} / ${total}`;
  });
  ['prev-btn','m-prev-btn'].forEach(id => {
    const b = document.getElementById(id);
    if (b) b.disabled = state.cur === 0;
  });
  ['next-btn','m-next-btn'].forEach(id => {
    const b = document.getElementById(id);
    if (b) b.disabled = state.cur >= total - 1;
  });

  const v = (slide && slide.variant) || 1;
  [1,2,3].forEach(n => {
    ['v'+n+'-btn','m-v'+n+'-btn'].forEach(id => {
      const b = document.getElementById(id);
      if (b) b.classList.toggle('active', v === n);
    });
  });

  const tog = document.getElementById('show-nums-toggle');
  if (tog) tog.checked = state.showNums;

  renderPaletteAll();
  renderSlideThumbs();
  renderMobileThumbStrip();
}

function renderPaletteAll() {
  // Topbar dots (desktop)
  const tb = document.getElementById('topbar-palette');
  if (tb) {
    tb.innerHTML = '';
    Object.entries(PALETTES).forEach(([name, pal]) => {
      const dot = document.createElement('div');
      dot.className = 'pal-dot' + (name === state.stilus ? ' active' : '');
      dot.title = name;
      dot.style.background = `linear-gradient(135deg, ${pal.primary} 50%, ${pal.bg} 50%)`;
      dot.addEventListener('click', () => { state.stilus = name; applyCSSVars(pal); renderAll(); });
      tb.appendChild(dot);
    });
  }
  // Mobile palette row
  const mb = document.getElementById('m-pal-row');
  if (mb) {
    mb.innerHTML = '';
    Object.entries(PALETTES).forEach(([name, pal]) => {
      const dot = document.createElement('div');
      dot.className = 'm-pal-dot' + (name === state.stilus ? ' active' : '');
      dot.title = name;
      dot.style.background = `linear-gradient(135deg, ${pal.primary} 50%, ${pal.bg} 50%)`;
      dot.addEventListener('click', () => { state.stilus = name; applyCSSVars(pal); renderAll(); });
      mb.appendChild(dot);
    });
  }
}

function renderMobileThumbStrip() {
  const strip = document.getElementById('m-thumb-strip');
  if (!strip) return;
  strip.innerHTML = '';
  const slides = getProcessed();
  const [W, H] = DIMS[state.ratio];
  const palette = PALETTES[state.stilus] || PALETTES.termeszetes;
  slides.forEach((slide, i) => {
    const item = document.createElement('div');
    item.className = 'm-thumb-item' + (i === state.cur ? ' active' : '');
    const content = renderSlide(slide, W, H, palette);
    item.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" style="width:64px;height:auto;display:block;">${content}</svg>`;
    item.addEventListener('click', () => { state.cur = i; renderPreviewTab(); });
    strip.appendChild(item);
  });
}

function navigatePreview(dir) {
  state.cur = Math.max(0, Math.min(state.slides.length - 1, state.cur + dir));
  renderPreviewTab();
  renderSlideThumbs();
}

function setVariant(v) {
  if (!state.slides[state.cur]) return;
  state.slides[state.cur].variant = v;
  renderPreviewTab();
  renderSlideEditor('slide-editor-body');
  renderSlideEditor('m-slide-editor');
  renderMiniPreview();
}

function randomVariant() { setVariant(Math.floor(Math.random() * 3) + 1); }

function shuffleAll() {
  state.slides.forEach(s => { s.variant = Math.floor(Math.random() * 3) + 1; });
  renderAll();
  toast('Változatok véletlenszerűsítve!');
}

function toggleShowNums() {
  state.showNums = document.getElementById('show-nums-toggle').checked;
  renderPreviewTab();
  renderMiniPreview();
}

// ─────────────────────────────────────────
// Ratio & palette
// ─────────────────────────────────────────
function setRatio(r) {
  state.ratio = r;
  document.getElementById('rb-45').classList.toggle('active', r === '4:5');
  document.getElementById('rb-11').classList.toggle('active', r === '1:1');
  renderAll();
}

function applyCSSVars(pal) {
  const root = document.documentElement;
  Object.entries(pal).forEach(([k, v]) => root.style.setProperty('--' + k, v));
}

// ─────────────────────────────────────────
// Toast
// ─────────────────────────────────────────
function toast(msg, duration) {
  if (duration === undefined) duration = 2500;
  const root = document.getElementById('toast-root');
  if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s';
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 350);
  }, duration);
}

// ─────────────────────────────────────────
// Full render
// ─────────────────────────────────────────
function renderAll() {
  const pal = PALETTES[state.stilus] || PALETTES.termeszetes;
  applyCSSVars(pal);
  renderSlideThumbs();
  renderMobileSlideList();
  renderSlideEditor('slide-editor-body');
  renderSlideEditor('m-slide-editor');
  renderMiniPreview();
  renderPreviewTab();
}

// ─────────────────────────────────────────
// Keyboard shortcuts
// ─────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft') navigatePreview(-1);
  if (e.key === 'ArrowRight') navigatePreview(1);
});

// ─────────────────────────────────────────
// Init
// ─────────────────────────────────────────
(function init() {
  state.slides = SAMPLE.slides.map(s => ({...s}));
  state.stilus = SAMPLE.stilus;
  const pal = PALETTES[state.stilus];
  applyCSSVars(pal);
  renderAll();
  const jsonStr = JSON.stringify({slides: state.slides, stilus: state.stilus}, null, 2);
  const ja = document.getElementById('json-area'); if (ja) ja.value = jsonStr;
  const mja = document.getElementById('m-json-area'); if (mja) mja.value = jsonStr;
  window.addEventListener('resize', () => renderPreviewTab());
})();
</script>
